components:
  schemas:
    ActionPlanStateEnum:
      enum:
      - OPEN
      - PROGRESS
      - DONE
      type: string
      description: |-
        * `OPEN` - Aberto
        * `PROGRESS` - Em andamento
        * `DONE` - Concluído
    Allocation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        balance:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/FinanceStateEnum'
          readOnly: true
        reason:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        created_by:
          type: integer
          readOnly: true
        approved_by:
          type: integer
          readOnly: true
          nullable: true
        budget:
          type: integer
        project:
          type: integer
          nullable: true
        cost_center:
          type: integer
          nullable: true
      required:
      - amount
      - approved_at
      - approved_by
      - balance
      - budget
      - created_at
      - created_by
      - id
      - reason
      - status
    Amendment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
