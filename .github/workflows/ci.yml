name: EngFinance checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: engfinance
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: engfinance
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
      POSTGRES_USER: engfinance
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: engfinance
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.lock.txt
      - working-directory: backend
        run: |
          python manage.py check
          python -m ruff check .
          python manage.py makemigrations --check --dry-run
          python -m pytest --ds=config.settings -p no:cacheprovider
          python manage.py spectacular --validate --fail-on-warn --file schema.yml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
